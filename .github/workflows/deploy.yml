name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-flight deploy (that can
# make deploy-pages fail).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          # Supabase credentials are inlined into the static bundle at build
          # time. Both are repo *variables* (Settings → Secrets and variables →
          # Actions → Variables) — neither is truly secret: the URL is public
          # and the anon/publishable key is safe to expose in the bundle, since
          # RLS is what enforces per-user isolation.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # Pin the auth magic-link redirect to the public site so links always
          # return to the deployed app (must match a Supabase Redirect URL).
          VITE_SITE_URL: https://hmugatu.github.io/Lyric-Chord-Composer/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      # deploy-pages intermittently reports "Deployment failed, try again
      # later" straight from GitHub's Pages backend even on a valid artifact
      # (actions/deploy-pages#406, #418). Give it more patience, and if the
      # first attempt still fails, make a second fresh attempt in the same job.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 1200000   # 20 min (default 10)
          error_count: 30    # tolerate more transient status errors (default 10)
          reporting_interval: 5000

      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
          error_count: 30
          reporting_interval: 5000
